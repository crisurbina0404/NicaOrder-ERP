<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustracion de referencia: insumos medicos (line-art blanco sobre degradado azul) -->

  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Estetoscopio (superior izquierdo) -->
    <g opacity="0.20" transform="translate(30,50)">
      <circle cx="60" cy="45" r="10"/>
      <path d="M60 55 C60 130 90 170 150 180"/>
      <path d="M100 40 C100 20 130 15 138 38"/>
      <path d="M150 180 L170 185"/>
      <circle cx="195" cy="195" r="26"/>
      <circle cx="195" cy="195" r="12"/>
    </g>

    <!-- Jeringa (superior derecho) -->
    <g opacity="0.16" transform="translate(520,80) rotate(25)">
      <rect x="0" y="20" width="180" height="52" rx="8"/>
      <line x1="36" y1="20" x2="36" y2="72"/>
      <line x1="72" y1="20" x2="72" y2="72"/>
      <line x1="108" y1="20" x2="108" y2="72"/>
      <line x1="144" y1="20" x2="144" y2="72"/>
      <rect x="-34" y="32" width="34" height="28"/>
      <line x1="-70" y1="46" x2="-34" y2="46"/>
      <path d="M180 34 L216 42 L216 50 L180 58"/>
      <line x1="216" y1="46" x2="238" y2="46"/>
    </g>

    <!-- Capsulas (izquierda, centro) -->
    <g opacity="0.18" transform="translate(60,380)">
      <g transform="rotate(-30 60 60)">
        <rect x="20" y="35" width="120" height="50" rx="25"/>
        <line x1="80" y1="35" x2="80" y2="85"/>
      </g>
      <g transform="translate(150,110) rotate(20)">
        <rect x="0" y="0" width="110" height="46" rx="23"/>
        <line x1="55" y1="0" x2="55" y2="46"/>
      </g>
      <circle cx="40" cy="185" r="14"/>
      <circle cx="85" cy="205" r="14"/>
    </g>

    <!-- Mascarilla (derecha, centro) -->
    <g opacity="0.16" transform="translate(520,400)">
      <path d="M20 60 C20 20 70 10 115 10 C160 10 210 20 210 60 C210 120 160 150 115 150 C70 150 20 120 20 60 Z"/>
      <path d="M55 45 C90 70 140 70 175 45"/>
      <path d="M55 85 C90 110 140 110 175 85"/>
      <path d="M20 55 L-18 40"/>
      <path d="M20 75 L-18 88"/>
      <path d="M210 55 L248 40"/>
      <path d="M210 75 L248 88"/>
    </g>

    <!-- Termometro (inferior izquierdo) -->
    <g opacity="0.17" transform="translate(80,680) rotate(35)">
      <line x1="30" y1="0" x2="30" y2="150"/>
      <circle cx="30" cy="175" r="24"/>
      <line x1="52" y1="30" x2="66" y2="30"/>
      <line x1="52" y1="60" x2="66" y2="60"/>
      <line x1="52" y1="90" x2="66" y2="90"/>
      <line x1="52" y1="120" x2="66" y2="120"/>
      <circle cx="30" cy="175" r="10" fill="#FFFFFF" stroke="none" opacity="0.9"/>
    </g>

    <!-- Frasco de medicamento (inferior derecho) -->
    <g opacity="0.18" transform="translate(540,690)">
      <rect x="35" y="0" width="80" height="30" rx="6"/>
      <rect x="20" y="30" width="110" height="140" rx="14"/>
      <rect x="38" y="70" width="74" height="56" rx="6"/>
      <line x1="50" y1="92" x2="100" y2="92"/>
      <line x1="50" y1="108" x2="88" y2="108"/>
      <path d="M155 60 L155 130" />
      <circle cx="155" cy="45" r="14"/>
    </g>

    <!-- Cruz medica dispersa -->
    <g opacity="0.12">
      <path d="M390 300 h18 v-18 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 Z"/>
    </g>
    <g opacity="0.10" transform="translate(330,860)">
      <path d="M9 0 h12 v9 h9 v12 h-9 v9 h-12 v-9 h-9 v-12 h9 Z"/>
    </g>
  </g>
</svg>
